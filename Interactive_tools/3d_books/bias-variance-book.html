/* ================= constants ================= */
const W = 1.1, H = 1.45, BASE = 0.03, HS = 0.22, LIFT = 0.004, BEAD_R = 0.02;
const CW = 1024, CH = 1350, SPLIT = 800;                       // page in logical px; the left page is static above SPLIT, live below

const INK = '#000000', INK_SOFT = '#1a2130', PAPER = '#ffffff';

  body: '"Source Serif 4", Georgia, serif',

  mono: '"IBM Plex Mono", ui-monospace, monospace',

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const linspace = (a, b, n) => Array.from({ length: n }, (_, i) => a + ((b - a) * i) / (n - 1));
const pageLift = d => 0.02 * (1 - Math.exp(-d / 0.08)) - 0.006 * (d / W);

/* ================= the model: polynomial least squares, with exact bias and variance =================
   Truth f(x) = sin 2πx + 0.8·exp(−((x − 0.7)/0.1)²) on [0, 1]. A training set is n evenly spaced inputs with
   y = f(x) + ε, ε ~ N(0, σ²), σ = 0.3. The model is a degree-d polynomial written in Legendre terms (the same
   fitted curve as plain powers of x; the basis only matters for the ridge penalty, which then treats every
   degree on the same scale). A least-squares fit is linear in y, f̂ = h(x)ᵀy, so its average and its variance
   over all training sets are exact: E f̂(x) = h(x)ᵀf and Var f̂(x) = σ²‖h(x)‖². Bias² and variance are averaged
   over 801 evenly spaced test inputs. The training error is exact too: with fitted values ŷ = Hy at the training
   inputs, E‖y − ŷ‖²/n = (‖(I − H)f‖² + σ²‖I − H‖²)/n. Nothing here is simulated. */
const SIG = 0.3, S2 = SIG * SIG, NPTS = 15, DMAX = 12, NT = 801, NE = 161;
const TRUTH = x => Math.sin(2 * Math.PI * x) + 0.8 * Math.exp(-(((x - 0.7) / 0.1) ** 2));
function leg(x, d) {
  const t = 2 * x - 1, p = new Float64Array(d + 1); p[0] = 1; if (d > 0) p[1] = t;
  for (let k = 2; k <= d; k++) p[k] = ((2 * k - 1) * t * p[k - 1] - (k - 1) * p[k - 2]) / k;
  return p;
}
const XT = linspace(0, 1, NT), FT = XT.map(TRUTH), LT = XT.map(x => leg(x, DMAX));
const XE = linspace(0, 1, NE), FE = XE.map(TRUTH), LE = XE.map(x => leg(x, DMAX));
const GRAM = (() => {
  const k = DMAX + 1, G = Array.from({ length: k }, () => new Float64Array(k));
  for (const p of LT) for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) G[i][j] += (p[i] * p[j]) / NT;
  return G;
})();
function solve(A, B) {   // Gaussian elimination with partial pivoting: returns X with A X = B (A is k×k, B is k×m)
  const k = A.length, m = B[0].length, a = A.map(r => Float64Array.from(r)), b = B.map(r => Float64Array.from(r));
  for (let c = 0; c < k; c++) {
    let p = c; for (let r = c + 1; r < k; r++) if (Math.abs(a[r][c]) > Math.abs(a[p][c])) p = r;
    [a[c], a[p]] = [a[p], a[c]]; [b[c], b[p]] = [b[p], b[c]];
    for (let r = c + 1; r < k; r++) {
      const f = a[r][c] / a[c][c]; if (!f) continue;
      for (let j = c; j < k; j++) a[r][j] -= f * a[c][j];
      for (let j = 0; j < m; j++) b[r][j] -= f * b[c][j];
    }
  }
  for (let c = k - 1; c >= 0; c--) for (let j = 0; j < m; j++) { let s = b[c][j]; for (let r = c + 1; r < k; r++) s -= a[c][r] * b[r][j]; b[c][j] = s / a[c][c]; }
  return b;
}
const MODELS = new Map();
function model(n, d, lam = 0) {
  const key = `${n}|${d}|${lam.toPrecision(6)}`;
  if (MODELS.has(key)) return MODELS.get(key);
  const k = d + 1, xs = linspace(0, 1, n), Phi = xs.map(x => leg(x, d)), fx = xs.map(TRUTH);
  const A = Array.from({ length: k }, (_, i) => { const r = new Float64Array(k); for (let j = 0; j < k; j++) { let s = 0; for (const p of Phi) s += p[i] * p[j]; r[j] = s; } return r; });
  for (let i = 1; i < k; i++) A[i][i] += lam;                       // the intercept is not penalized
  const M = solve(A, Array.from({ length: k }, (_, i) => Float64Array.from(Phi, p => p[i])));   // k × n: coefficients = M y
  const c = M.map(r => r.reduce((s, v, j) => s + v * fx[j], 0));   // coefficients of the average fit E f̂
  let b2 = 0;
  for (let t = 0; t < NT; t++) { let s = 0; for (let i = 0; i < k; i++) s += LT[t][i] * c[i]; b2 += (s - FT[t]) ** 2; }

  for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) { let s = 0; for (let q = 0; q < n; q++) s += M[i][q] * M[j][q]; v += GRAM[i][j] * s; }

}
function play() { if (busy) return; if (sim.status === 'done') resetSim(); playing = true; sim.status = 'running'; acc = cfg.stepMs; updateButtons(); liveDirty = true; }

function refreshTex(...keys) { for (const k of keys) TX[k].needsUpdate = true; }

const riseUp = then => tween(cfg.kind === 'surface' ? 850 : 900, p => applyRise(easeBack(p)), () => { applyRise(1); if (then) then(); });

function goTo(n) {

  setGuide(false); busy = true; pause();
  drawLeftLive(); drawRight(P.right.ctx, spread, true); refreshTex('live', 'right');   // print the live figure before the pop-up folds flat

}
function startFlip(n) {

  popRoot.visible = false;
  if (dir > 0) { raw(P.front.ctx); P.front.ctx.drawImage(P.right.canvas, 0, 0); }
  else { raw(P.back.ctx); P.back.ctx.drawImage(P.top.canvas, 0, 0); P.back.ctx.drawImage(P.live.canvas, 0, Math.round(SPLIT * SCALE)); }
  spread = n; enterSpread(); applyRise(0);

    popRoot.visible = true; busy = false;

  });
}

$('prev').addEventListener('click', () => goTo(spread - 1));
$('next').addEventListener('click', () => goTo(spread + 1));
addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight') goTo(spread + 1);
  else if (e.key === 'ArrowLeft') goTo(spread - 1);
  else if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && guideOn) setGuide(false); });
playBtn.addEventListener('click', () => (playing ? pause() : play()));
stepBtn.addEventListener('click', () => { if (busy) return; playing = false; stepSim(); if (sim.status !== 'done') sim.status = 'paused'; updateButtons(); });
$('reset').addEventListener('click', () => { if (busy) return; resetSim(); });
$('resample').addEventListener('click', () => { if (busy) return; st.seed++; restart(); });
document.querySelectorAll('[data-bias]').forEach(b => b.addEventListener('click', () => { if (busy) return; st.bias = +b.dataset.bias; syncHud(); restart(); }));
document.querySelectorAll('[data-vari]').forEach(b => b.addEventListener('click', () => { if (busy) return; st.vari = +b.dataset.vari; syncHud(); restart(); }));
function setDegree(d) {
  if (spread === 1) { st.d = d; $('degOut').textContent = String(d); buildWires(); drawRight(P.right.ctx, spread, false); refreshTex('right'); liveDirty = true; }
  else if (spread === 2) { pause(); setSurfPoint(st, d, st.k); }
}
$('deg').addEventListener('input', e => setDegree(+e.target.value));
document.querySelectorAll('[data-deg]').forEach(b => b.addEventListener('click', () => { $('deg').value = b.dataset.deg; setDegree(+b.dataset.deg); }));
$('nIdx').addEventListener('input', e => { pause(); setSurfPoint(st, st.d, +e.target.value); });
function setLam(l) { st.lam = l; $('lam').value = l === 0 ? LAM_MIN : Math.log10(l); $('lamOut').textContent = lamText(l); buildWires(); liveDirty = true; }
$('lam').addEventListener('input', e => setLam(lamOf(+e.target.value)));
document.querySelectorAll('[data-lam]').forEach(b => b.addEventListener('click', () => setLam({ none: 0, best: BEST_LAM, heavy: 30 }[b.dataset.lam])));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$('light').addEventListener('click', () => setLamp(!lampOn));
$('guideFab').addEventListener('click', () => { if (!busy) setGuide(!guideOn); });

// pointer: click the surface to move the bead, click a page edge to turn, double-click the text to read it
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), cv = renderer.domElement;
function aim(e) { const r = cv.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
function pickSurface() { if (busy || cfg.kind !== 'surface' || pop.rise < 0.9 || !popRoot.visible) return null; const hit = ray.intersectObject(surfMesh)[0]; return hit ? w2d(hit.point) : null; }
const pickLamp = () => ray.intersectObject(lampModel, true).length > 0;
function pickPage() { const t = (BASE + 0.012 - ray.ray.origin.y) / ray.ray.direction.y; if (!(t > 0)) return null; const p = ray.ray.at(t, _v); return Math.abs(p.z) <= H / 2 && Math.abs(p.x) <= W ? p.x : null; }

let down = null, hoverT = 0;
cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
cv.addEventListener('pointerup', e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 450; down = null;
  if (moved > 6 || !quick) return;
  aim(e); if (pickLamp()) { setLamp(!lampOn); return; }
  const p = pickSurface();
  if (p) { pause(); setSurfPoint(st, clamp(Math.round(dOfX(p[0])), 0, DMAX), clamp(Math.round(kOfY(p[1])), 0, NLEV - 1)); return; }
  const edge = edgeOf(pickPage()); if (edge) goTo(spread + edge);
});
cv.addEventListener('dblclick', e => { aim(e); if (pickLamp() || pickSurface()) return; const x = pickPage(); if (x !== null && x < 0) setView(view === 'text' ? 'book' : 'text'); else if (x === null) setView('book'); });
cv.addEventListener('pointermove', e => {

  aim(e); cv.style.cursor = pickLamp() ? 'pointer' : pickSurface() ? 'crosshair' : edgeOf(pickPage()) ? 'pointer' : 'grab';
});

new ResizeObserver(() => { document.documentElement.style.setProperty('--hud-h', $('hud').offsetHeight + 'px'); resize(); }).observe($('hud'));
addEventListener('resize', resize);

/* ================= frame loop ================= */
let prevT = performance.now();
function tick(now) {

  }
  if (cfg.kind === 'darts') for (const o of dartObjs) if (o.visible) placeDart(o, now);
  if (cfg.kind === 'surface') { const [d, k] = beadNow(st, now); d2w(xOfD(d), yOfK(k), BEAD_R, _v); bead.position.copy(_v); }
  if (cardDirty && !busy) drawCard();
  if (liveDirty && !busy && now - lastLiveDraw > 90) {
    drawLeftLive(); TX.live.needsUpdate = true; lastLiveDraw = now; liveDirty = false;
    if (sim.status === 'done') { const s = cfg.kind === 'darts' ? dartsStatus()[0] : ''; if (s && s !== liveEl.textContent) liveEl.textContent = s; }
  }
  if (camTween) {
    const p = clamp((now - camTween.t0) / 700, 0, 1), e = easeIO(p);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.q0, camTween.q1, e);

  requestAnimationFrame(tick);
}

/* ================= start ================= */
let autoplay = true;
enterSpread(); syncHud(); resize(); redrawAll(); applyRise(0);
requestAnimationFrame(tick);
// scripting hook, used for testing and for recording walkthrough videos
window.__book = {

  setDegree, setLam, setSurfPoint: (d, k) => setSurfPoint(SPREADS[2].st, d, k), easel, HINGE, CARD, ALPHA,
  setLamp, get lampOn() { return lampOn; }, setGuide, get guideOn() { return guideOn; }, sfx, renderSfx, get audioState() { return actx ? actx.state : 'none'; },
  get spread() { return spread; }, get busy() { return busy; }, get st() { return st; },
  get autoplay() { return autoplay; }, set autoplay(v) { autoplay = v; },

  `700 68px "Libre Caslon Text"`, `600 30px "Source Serif 4"`, `700 30px "Source Serif 4"`, `italic 600 33px "Source Serif 4"`, `600 22px "IBM Plex Mono"`, `700 40px Caveat`,
].map(f => document.fonts.load(f, 'Aaσλεd')).concat(document.fonts.load(`italic 600 40px "STIX Two Text"`, 'f̂εσλ‖ᵢ²−'), document.fonts.load(`600 40px "STIX Two Text"`, 'BiasVarE[]()=+−~²')))
  .catch(() => {}).then(() => document.fonts.ready).catch(() => {}).then(() => {

  });
