<style>
  /* Layout: one full-bleed WebGL desk scene (a single night-desk look, by choice) above a docked control bar. */
  :root {
    color-scheme: dark;
    --desk: #120c08;
    --panel: rgba(28, 20, 15, 0.94);
    --panel-edge: rgba(240, 226, 204, 0.16);
    --text: #f3e9d8;
    --muted: #bfae94;
    --lamp: #e8a640;
    --lamp-ink: #1d1209;
    --field: rgba(240, 226, 204, 0.09);
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--desk);
    color: var(--text);
    font-family: var(--font-ui);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #stage { position: fixed; inset: 0 0 var(--hud-h, 120px) 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .vignette {
    position: fixed; inset: 0 0 var(--hud-h, 120px) 0; pointer-events: none;
    background: radial-gradient(120% 95% at 45% 40%, transparent 60%, rgba(6, 4, 2, 0.5) 100%);
  }
  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 11px calc(11px + env(safe-area-inset-bottom, 0px));
    background: var(--panel);
    border-top: 1px solid var(--panel-edge);
  }
  .hud-inner { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 9px 20px; }
  .group { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .label .sym { text-transform: none; letter-spacing: 0; font-size: 14px; }
  select, button {
    font: 500 14px var(--font-ui); color: var(--text);
    background: var(--field); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
  }
  select option { background: #241a13; }
  button:hover:not(:disabled) { background: rgba(240, 226, 204, 0.16); }
  button.primary, button[aria-pressed="true"] { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); }
  button.primary { min-width: 82px; }
  button:disabled { opacity: 0.4; cursor: default; }
  :is(select, button, input):focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  input[type="range"] { width: 150px; accent-color: var(--lamp); }
  output { font: 500 14px var(--font-mono); font-variant-numeric: tabular-nums; min-width: 3.4em; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .chk input { accent-color: var(--lamp); width: 16px; height: 16px; }
  .buttons { display: flex; gap: 8px; }
  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .pager { display: flex; align-items: center; gap: 10px; padding-right: 20px; border-right: 1px solid var(--panel-edge); }
  .pagelabel { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 9em; text-align: center; }
  .spacer { flex: 1 1 0; }
  .hint { flex-basis: 100%; margin: 0; font-size: 12.5px; color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .fallback { position: fixed; inset: 0 0 var(--hud-h, 120px) 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
  @media (max-width: 700px) {
    input[type="range"] { width: 112px; }
    .hud-inner { gap: 9px 14px; }
    .pager { border-right: 0; padding-right: 0; flex-basis: 100%; justify-content: space-between; }
    .spacer { display: none; }
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

/* ================= constants ================= */
const W = 1.1, H = 1.45, BASE = 0.03, HS = 0.22, LIFT = 0.004, BEAD_R = 0.02;
const CW = 1024, CH = 1350, SPLIT = 800;                       // page in logical px; the left page is static above SPLIT, live below
const SCALE = Math.min(innerWidth, innerHeight) < 600 ? 1.5 : 2; // backing-store scale of the page canvases
const MX0 = 112, MY0 = 150, MS = 800, DOM = 3, LIM = 2.97;      // figure box on right pages; domain is [-3, 3]^2
const X0 = 96, XR = 928, TW = XR - X0;                          // text column on left pages
const TOL = 2e-3, FLIP_MS = 950;
const INK = '#000000', INK_SOFT = '#1a2130', PAPER = '#ffffff';
const AMBER = '#a85300', ROSE = '#b0124f', GREEN = '#0d6b45', RED = '#a01a10', BLUE = '#1f44a8';
const FONT = {
  head: '"Libre Caslon Text", Georgia, serif',
  body: '"Source Serif 4", Georgia, serif',
  math: '"STIX Two Text", "Cambria Math", "Times New Roman", serif',
  mono: '"IBM Plex Mono", ui-monospace, monospace',
  hand: 'Caveat, "Segoe Print", cursive',
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pageLift = d => 0.02 * (1 - Math.exp(-d / 0.08)) - 0.006 * (d / W);
const pageY = d => BASE + pageLift(d);
const toCanvas = (x, y) => [MX0 + ((x + DOM) / (2 * DOM)) * MS, MY0 + ((DOM - y) / (2 * DOM)) * MS];
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const gauss = rng => Math.sqrt(-2 * Math.log(rng() + 1e-12)) * Math.cos(2 * Math.PI * rng());
const fmt = n => (!isFinite(n) ? '∞' : Math.abs(n) >= 100 ? n.toFixed(1) : n.toFixed(4));

/* ================= loss surfaces ================= */
const SURF = {
  ravine: {
    f(x, y) { const c = Math.cos(0.5), s = Math.sin(0.5), u = c * x + s * y, v = -s * x + c * y; return 0.5 * (0.12 * u * u + 1.6 * v * v); },
    h: d => 1 - Math.exp(-d / 5),
  },
  valleys: {
    f(x, y) { return 1.5 - 1.2 * Math.exp(-((x - 1.3) ** 2 + (y - 0.8) ** 2) / 1.2) - 0.8 * Math.exp(-((x + 1.3) ** 2 + (y + 1.1) ** 2) / 0.7) + 0.06 * (x * x + y * y); },
    h: d => d / 2.4,
  },
  trough: { f(x) { return 0.8 * x * x; }, h: d => d / 9 },   // L = ½λθ₁² with λ = 1.6
};
for (const s of Object.values(SURF)) {
  s.fmin = Infinity;
  for (let j = 0; j <= 240; j++) for (let i = 0; i <= 240; i++) s.fmin = Math.min(s.fmin, s.f(-DOM + i * 0.025, -DOM + j * 0.025));
  s.hOf = (x, y) => clamp(s.h(s.f(x, y) - s.fmin), 0, 1);
  s.grad = (x, y) => { const e = 1e-4; return [(s.f(x + e, y) - s.f(x - e, y)) / (2 * e), (s.f(x, y + e) - s.f(x, y - e)) / (2 * e)]; };
}

/* contour map: the same image is printed on the page and wrapped over the 3D pop-up */
const STOPS = [[0, 18, 44, 110], [0.3, 62, 108, 186], [0.65, 160, 188, 224], [1, 238, 232, 216]];
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function buildMap(s) {
  const R = 1200, hA = new Float32Array(R * R);
  for (let py = 0; py < R; py++) { const y = DOM - ((py + 0.5) / R) * 2 * DOM; for (let px = 0; px < R; px++) hA[py * R + px] = s.hOf(-DOM + ((px + 0.5) / R) * 2 * DOM, y); }
  const c = makeCanvas(R, R), ctx = c.getContext('2d'), img = ctx.createImageData(R, R), d = img.data, STEP = 0.05, lw = (R / 800) * 0.9;
  for (let py = 0; py < R; py++) for (let px = 0; px < R; px++) {
    const i = py * R + px, h = hA[i];
    const gx = (hA[py * R + Math.min(px + 1, R - 1)] - hA[py * R + Math.max(px - 1, 0)]) * 0.5;
    const gy = (hA[Math.min(py + 1, R - 1) * R + px] - hA[Math.max(py - 1, 0) * R + px]) * 0.5;
    const gm = Math.hypot(gx, gy);
    let line = 0;
    if (gm > 1e-6) { const t = h / STEP, fr = t - Math.floor(t); line = clamp(lw + 0.5 - (Math.min(fr, 1 - fr) * STEP) / gm, 0, 1) * 0.72; }
    let k = 1; while (k < STOPS.length - 1 && h > STOPS[k][0]) k++;
    const a = STOPS[k - 1], b = STOPS[k], u = clamp((h - a[0]) / (b[0] - a[0]), 0, 1), p = i * 4;
    d[p] = lerp(lerp(a[1], b[1], u) * 0.84 + 39, 12, line);
    d[p + 1] = lerp(lerp(a[2], b[2], u) * 0.84 + 38, 24, line);
    d[p + 2] = lerp(lerp(a[3], b[3], u) * 0.84 + 36, 66, line);
    d[p + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}
for (const s of Object.values(SURF)) s.map = buildMap(s);

/* ================= page canvases ================= */
function mk(w, h) { const canvas = makeCanvas(Math.round(w * SCALE), Math.round(h * SCALE)); return { canvas, ctx: canvas.getContext('2d') }; }
const P = { top: mk(CW, SPLIT), live: mk(CW, CH - SPLIT), right: mk(CW, CH), front: mk(CW, CH), back: mk(CW, CH) };

function prep(c, dy = 0) { c.setTransform(SCALE, 0, 0, SCALE, 0, -dy * SCALE); c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.setLineDash([]); }
function paper(c, gutterRight, y0, y1) {
  c.fillStyle = PAPER; c.fillRect(0, y0, CW, y1 - y0);
  const g = c.createLinearGradient(gutterRight ? CW : 0, 0, gutterRight ? CW - 90 : 90, 0);   // a soft shadow in the gutter only: the rest stays pure white
  g.addColorStop(0, 'rgba(20,24,32,0.22)'); g.addColorStop(1, 'rgba(20,24,32,0)');
  c.fillStyle = g; c.fillRect(0, y0, CW, y1 - y0);
}
function wrap(c, text, x, y, maxW, lh) {
  let line = '';
  for (const w of text.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { c.fillText(line, x, y); y += lh; line = w; } else line = test;
  }
  if (line) { c.fillText(line, x, y); y += lh; }
  return y;
}
function spaced(c, text, x, y, sp) { if ('letterSpacing' in c) { c.letterSpacing = sp + 'px'; c.fillText(text, x, y); c.letterSpacing = '0px'; } else c.fillText(text, x, y); }
function fitText(c, text, x, y, maxW, style, size, fam) {
  let s = size; c.font = `${style} ${s}px ${fam}`;
  while (c.measureText(text).width > maxW && s > 14) { s -= 1; c.font = `${style} ${s}px ${fam}`; }
  c.fillText(text, x, y);
}
function header(c, sec, title) {
  c.fillStyle = INK_SOFT; c.font = `600 22px ${FONT.mono}`; spaced(c, `§ ${sec}  ·  OPTIMISATION`, X0, 112, 3);
  c.fillStyle = INK; fitText(c, title, X0, 196, TW, '700', 68, FONT.head);
  c.fillRect(X0, 224, TW, 3);
  return 290;
}
function para(c, text, y) { c.font = `600 32px ${FONT.body}`; c.fillStyle = INK; return wrap(c, text, X0, y, TW, 46) + 14; }
const UPRIGHT = /([∇Σ←√]+)/;   // operators stay upright; everything else in an equation is italic
function mathText(c, text, x, y, size, align) {
  const parts = text.split(UPRIGHT).filter(Boolean), fonts = parts.map(p => `${UPRIGHT.test(p) ? '' : 'italic '}600 ${size}px ${FONT.math}`), gap = size * 0.07;
  const ws = parts.map((p, i) => { c.font = fonts[i]; return c.measureText(p).width; });
  let cx = x - (align === 'center' ? (ws.reduce((a, b) => a + b, 0) + (parts.length - 1) * gap) / 2 : 0);
  c.textAlign = 'left';
  parts.forEach((p, i) => { c.font = fonts[i]; c.fillText(p, cx, y); cx += ws[i] + gap; });
}
function eqBox(c, lines, label, y) {
  const top = y - 24, h = 36 + lines.length * 56;
  c.fillStyle = 'rgba(8,16,34,0.07)'; c.fillRect(X0, top, TW, h);
  c.strokeStyle = INK; c.lineWidth = 1.5; c.strokeRect(X0 + 0.75, top + 0.75, TW - 1.5, h - 1.5);
  c.fillStyle = INK;
  lines.forEach((l, i) => mathText(c, l, X0 + TW / 2, top + 58 + i * 56, 40, 'center'));
  c.textAlign = 'right'; c.font = `600 25px ${FONT.body}`; c.fillStyle = INK_SOFT; c.fillText(label, XR - 18, top + h / 2 + 9);
  c.textAlign = 'left';
  return top + h + 54;
}
function liveHead(c, label) {
  c.fillStyle = INK; c.fillRect(X0, 820, TW, 1.5);
  c.fillStyle = INK_SOFT; c.font = `600 19px ${FONT.mono}`; spaced(c, label, X0, 852, 2.5);
}
function rows(c, list, x, y, w) {
  list.forEach(([k, v, col], i) => {
    const ry = y + i * 44;
    c.font = `600 25px ${FONT.body}`; c.fillStyle = INK_SOFT; c.fillText(k, x, ry);
    c.font = `600 24px ${FONT.mono}`; c.fillStyle = col || INK; c.textAlign = 'right'; c.fillText(v, x + w, ry); c.textAlign = 'left';
    c.fillStyle = 'rgba(8,16,34,0.22)'; c.fillRect(x, ry + 13, w, 1.2);
  });
}
function swatch(c, color, x, y) { c.fillStyle = color; c.fillRect(x, y - 11, 34, 6); }
function statusLine(c, text, color) { c.fillStyle = color || INK; fitText(c, text, X0, 1106, TW, '700', 28, FONT.body); }
function note(c, text) {
  c.save(); c.translate(X0 + 4, 1176); c.rotate(-0.022);
  c.fillStyle = BLUE; fitText(c, text, 0, 0, TW - 20, '700', 40, FONT.hand); c.restore();
}
function pageNum(c, n) { c.font = `600 23px ${FONT.body}`; c.fillStyle = INK_SOFT; c.textAlign = 'center'; c.fillText(String(n), CW / 2, 1298); c.textAlign = 'left'; }
function lineChart(c, bx, by, bw, bh, title, series, o = {}) {
  c.font = `600 18px ${FONT.mono}`; c.fillStyle = INK_SOFT; spaced(c, title, bx, by + 14, 2);
  const top = by + 34, bot = by + bh - 28, n = Math.max(o.nMin || 20, ...series.map(s => s.v.length - 1));
  c.fillStyle = INK; c.fillRect(bx, bot, bw, 2); c.fillRect(bx, top - 4, 2, bot - top + 4);
  c.font = `600 17px ${FONT.mono}`; c.fillStyle = INK_SOFT;
  c.fillText('0', bx, bot + 23); c.textAlign = 'right'; c.fillText(`t = ${n}`, bx + bw, bot + 23); c.textAlign = 'left';
  const val = v => (o.log ? Math.log10(Math.max(v, 1e-7)) : v);
  let mn = Infinity, mx = -Infinity;
  for (const s of series) for (const v of s.v) { const q = val(v); if (q < mn) mn = q; if (q > mx) mx = q; }
  if (!isFinite(mn)) return;
  if (mx - mn < 1e-9) mx = mn + 1;
  const X = i => bx + 3 + (i / n) * (bw - 8), Y = q => bot - 4 - ((q - mn) / (mx - mn)) * (bot - top - 8);
  c.textAlign = 'right'; c.fillText(o.log ? 'log scale' : `max ${fmt(Math.max(...series.map(s => Math.max(...s.v))))}`, bx + bw, by + 14); c.textAlign = 'left';
  for (const s of series) {
    if (s.v.length < 2) continue;
    c.beginPath(); s.v.forEach((v, i) => (i ? c.lineTo(X(i), Y(val(v))) : c.moveTo(X(i), Y(val(v)))));
    c.strokeStyle = s.color; c.lineWidth = 3.2; c.lineJoin = 'round'; c.stroke();
    c.beginPath(); c.arc(X(s.v.length - 1), Y(val(s.v[s.v.length - 1])), 6, 0, Math.PI * 2); c.fillStyle = s.color; c.fill();
  }
}

/* ================= simulation state ================= */
let spread = 0, cfg = null, st = null, playing = false, busy = false, acc = 0, liveDirty = true, lastA = 1;
const sim = { t: 0, status: 'ready', t0: 0, tracks: [] };
const pop = { s: SURF.ravine, rise: 0 };

function stepTrack(tr, t) {
  tr.from = [tr.x, tr.y];
  if (tr.done) return;
  const s = pop.s; let [gx, gy] = s.grad(tr.x, tr.y);
  if (tr.sd) { gx += tr.sd * gauss(tr.rng); gy += tr.sd * gauss(tr.rng); }
  const lr = tr.decay ? st.eta / (1 + t / 30) : st.eta;
  if (tr.beta) { tr.vx = tr.beta * tr.vx + gx; tr.vy = tr.beta * tr.vy + gy; gx = tr.vx; gy = tr.vy; }
  let nx = tr.x - lr * gx, ny = tr.y - lr * gy;
  if (!isFinite(nx) || !isFinite(ny)) { nx = tr.x; ny = tr.y; tr.done = 'diverged'; }
  if (Math.abs(nx) > LIM || Math.abs(ny) > LIM) {
    if (tr.sd) { nx = clamp(nx, -LIM, LIM); ny = clamp(ny, -LIM, LIM); }
